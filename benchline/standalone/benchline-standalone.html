<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>Benchline Scheduler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap&subset=cyrillic">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/delaunator@5.0.1/delaunator.min.js"></script>
<style>
/* Layout: app bar, settings rail on the left (stacks on phones), results workspace on the right */
:root{
  --bg:#eceff0; --panel:#ffffff; --sunk:#f4f6f7; --ink:#1a2226; --muted:#5a676e; --line:#d2d9dc;
  --accent:#d9540b; --accent-ink:#ffffff; --ore:#c68a0f; --waste:#8a97a1; --sp:#23837f; --good:#2f8a4a; --bad:#c23a2b;
  --rest:#dfe4e6;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111618; --panel:#192024; --sunk:#141a1d; --ink:#e3e8ea; --muted:#94a2a9; --line:#2b353a;
  --accent:#ff7a2f; --accent-ink:#1a0d04; --ore:#e0a52a; --waste:#73828c; --sp:#3db1aa; --good:#58b874; --bad:#ef6a5a;
  --rest:#262f34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111618; --panel:#192024; --sunk:#141a1d; --ink:#e3e8ea; --muted:#94a2a9; --line:#2b353a;
  --accent:#ff7a2f; --accent-ink:#1a0d04; --ore:#e0a52a; --waste:#73828c; --sp:#3db1aa; --good:#58b874; --bad:#ef6a5a;
  --rest:#262f34; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand h1{font-size:20px;letter-spacing:.01em}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.bar .status{margin-left:auto;font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.lang{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lang button{border:0;background:var(--panel);padding:4px 10px;cursor:pointer;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.app{display:grid;grid-template-columns:350px minmax(0,1fr);gap:16px;align-items:start;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:920px){.app{grid-template-columns:minmax(0,1fr)}}

.side{display:flex;flex-direction:column;gap:12px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.step>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font-family:var(--f-display);font-weight:600;font-size:16px}
.step>summary::-webkit-details-marker{display:none}
.step>summary .n{font-family:var(--f-mono);font-size:11px;font-weight:500;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--accent);color:var(--accent);flex:none}
.step>summary .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.step[open]>summary .chev{transform:rotate(90deg)}
.step .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.field>span em{font-style:normal;font-family:var(--f-mono);font-size:10.5px}
.field input,.field select{width:100%;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-size:13px}
.field input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.field.wide{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted);margin:0}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:1.5px dashed var(--line);border-radius:6px;padding:16px 10px;cursor:pointer;background:var(--sunk)}
.drop:hover,.drop.over{border-color:var(--accent)}
.drop b{font-weight:600}
.drop span{font-size:12px;color:var(--muted)}
#file{position:absolute;width:1px;height:1px;opacity:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);word-break:break-all}
.sub{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}

.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{font-size:13px;padding:8px 12px;border-radius:4px;border:1px solid var(--line);background:var(--panel);border-left:3px solid var(--ore)}
.alert.err{border-left-color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,148px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-mono);font-size:clamp(15px,1.25vw,19px);font-weight:500;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .d{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.kpi.npv .v{color:var(--accent)}

.work{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);padding:0 8px;align-items:flex-end}
.tab{border:0;background:none;padding:11px 12px 9px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .tools{margin-left:auto;display:flex;gap:6px;padding:6px 0}
.tabs .tools .btn{white-space:nowrap}
.panel{padding:14px}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.charts{grid-template-columns:minmax(0,1fr)}}
.chart h3{font-size:14px;font-weight:600;margin-bottom:6px}
.chart .box{position:relative;height:250px}

.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:12.5px;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;position:sticky;top:0;background:var(--panel)}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
th{z-index:2}td:first-child{z-index:1}th:first-child{z-index:3}
.field input:disabled,.field select:disabled{opacity:.5}
tfoot td{font-weight:600;border-top:1.5px solid var(--ink)}
.gantt td{text-align:center;padding:4px 3px;min-width:62px;font-size:11px;line-height:1.25;border-left:1px solid var(--line)}
.gantt td.c small{display:block;color:var(--muted);font-size:10px}
.gantt td:first-child{font-family:var(--f-body);font-weight:600;font-size:12.5px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.views{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:1100px){.views{grid-template-columns:minmax(0,1fr)}}
.ctrl{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.ctrl .field{min-width:120px}
.ctrl .field.grow{flex:1;min-width:200px}
.ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.vhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.vhead h3{font-size:14px}
.vhead .num{font-size:12px;color:var(--muted)}
canvas.view{width:100%;display:block;background:var(--sunk);border:1px solid var(--line);border-radius:4px;cursor:crosshair}
.legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.ramp{width:160px;height:10px;border-radius:2px}
#viewInfo{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-height:18px;margin-top:6px}

.modal{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(760px,100%);padding:16px;display:flex;flex-direction:column;gap:10px}
.modal textarea{width:100%;height:46vh;font-family:var(--f-mono);font-size:12px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px;resize:vertical}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.dtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
#dSrc{display:flex;flex-direction:column;gap:2px;margin:8px 0}
#dAlerts{margin-bottom:8px}
.dctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin:4px 0 12px}
.dctl .field{min-width:120px}
.dctl input[type=range]{accent-color:var(--accent);padding:0;background:none;border:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding-bottom:6px;cursor:pointer}
.chk input{accent-color:var(--accent)}
.d3wrap{position:relative;height:min(64vh,620px);min-height:340px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--sunk)}
.d3wrap.over{outline:2px dashed var(--accent);outline-offset:-4px}
#d3{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.readout{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:4px;padding:5px 9px;font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;pointer-events:none}
.compass{position:absolute;right:10px;top:10px;width:48px;height:48px;border-radius:50%;background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);pointer-events:none}
.compass .cin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.compass b{font-family:var(--f-mono);font-size:10px;line-height:1;color:var(--ink)}
.dnav{position:absolute;right:10px;bottom:10px;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:3px 7px;border-radius:4px;pointer-events:none}
@media (max-width:700px){.dnav{display:none}}
.dempty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px;font-size:14px}
.dparams{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 12px}
.dsec{margin-top:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dsec h3{font-size:15px}
.dsec .vhead{align-items:center}
.dsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 22px}
@media (max-width:900px){.dsplit{grid-template-columns:minmax(0,1fr)}}
tr.sel td{background:color-mix(in srgb,var(--accent) 16%,var(--panel))}
#dBlk tbody tr{cursor:pointer}
#dBlk tbody tr:hover td{background:color-mix(in srgb,var(--ink) 5%,var(--panel))}
#dBlk tbody tr.sel:hover td{background:color-mix(in srgb,var(--accent) 20%,var(--panel))}
.xbtn{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 6px}
.xbtn:hover{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="bar">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M1 6h28M4 11h22M7 16h16M10 21h10M13 26h4" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="square" fill="none"/></svg>
    <div><h1>Benchline</h1><small data-i="tagline"></small></div>
  </div>
  <div class="status" id="status"></div>
  <div class="lang" role="group" aria-label="Language / Язык">
    <button type="button" id="langRu" data-lang="ru" aria-pressed="true">RU</button>
    <button type="button" id="langEn" data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>

<div class="app">
<aside class="side" id="side">
  <details class="step" open>
    <summary><span class="n">1</span><span data-i="s1"></span><span class="chev">›</span></summary>
    <div class="body">
      <label class="drop" id="drop" for="file">
        <b data-i="dropB"></b>
        <span data-i="dropS"></span>
      </label>
      <input type="file" id="file" accept=".csv,.txt,.asc,.dat,.prn,.tsv">
      <div class="row"><button class="btn" id="demoBtn" type="button" data-i="demo"></button><span class="src" id="srcInfo"></span></div>
      <div class="sub" data-i="colmap"></div>
      <div class="grid2" id="mapGrid"></div>
      <div class="grid2">
        <label class="field"><span><span data-i="bx"></span> <em data-i="u_m"></em></span><input type="number" id="bx" value="20" min="0.1" step="any" data-lv="model"></label>
        <label class="field"><span><span data-i="by"></span> <em data-i="u_m"></em></span><input type="number" id="by" value="20" min="0.1" step="any" data-lv="model"></label>
        <label class="field"><span><span data-i="bz"></span> <em data-i="u_m"></em></span><input type="number" id="bz" value="10" min="0.1" step="any" data-lv="model"></label>
        <label class="field"><span><span data-i="dens"></span> <em data-i="u_tm3"></em></span><input type="number" id="dens" value="2.7" min="0.1" step="0.01" data-lv="model"></label>
      </div>
      <p class="hint" data-i="sizesHint"></p>
      <div class="sub" data-i="filter"></div>
      <div class="grid2">
        <label class="field wide"><span data-i="fWhere"></span><select id="fCol" data-lv="model"></select></label>
        <label class="field"><span data-i="fTest"></span><select id="fOp" data-lv="model"><option value="eq">=</option><option value="ne">≠</option><option value="gt">&gt;</option><option value="ge">≥</option><option value="lt">&lt;</option><option value="le">≤</option></select></label>
        <label class="field"><span data-i="fValue"></span><input id="fVal" data-lv="model" data-ip="fValPh"></label>
      </div>
    </div>
  </details>

  <details class="step" open>
    <summary><span class="n">2</span><span data-i="s2"></span><span class="chev">›</span></summary>
    <div class="body">
      <div class="grid2">
        <label class="field wide"><span data-i="phSrc"></span><select id="phSrc" data-lv="model"><option value="col" data-i="phCol"></option><option value="auto" data-i="phAuto"></option></select></label>
        <label class="field"><span><span data-i="phN"></span> <em data-i="u_cnt"></em></span><input type="number" id="phN" value="4" min="1" max="12" step="1" data-lv="model"></label>
        <label class="field"><span><span data-i="lag"></span> <em data-i="u_ben"></em></span><input type="number" id="lag" value="2" min="0" step="1"></label>
        <label class="field"><span><span data-i="sink"></span> <em data-i="u_benp"></em></span><input type="number" id="sink" value="3" min="1" step="1"></label>
        <label class="field"><span data-i="maxAct"></span><input type="number" id="maxAct" value="2" min="1" step="1"></label>
      </div>
      <p class="hint" data-i="phHint"></p>
    </div>
  </details>

  <details class="step" open>
    <summary><span class="n">3</span><span data-i="s3"></span><span class="chev">›</span></summary>
    <div class="body">
      <div class="grid2">
        <label class="field"><span data-i="ppy"></span><select id="ppy"><option value="12" data-i="month"></option><option value="4" selected data-i="quarter"></option><option value="1" data-i="year"></option></select></label>
        <label class="field"><span data-i="maxP"></span><input type="number" id="maxP" value="60" min="1" max="400" step="1"></label>
        <label class="field"><span><span data-i="mineCap"></span> <em data-i="u_ktp"></em></span><input type="number" id="mineCap" value="3000" min="1" step="any"></label>
        <label class="field"><span><span data-i="millCap"></span> <em data-i="u_ktp"></em></span><input type="number" id="millCap" value="700" min="0" step="any"></label>
        <label class="field"><span><span data-i="spCap"></span> <em data-i="u_kt"></em></span><input type="number" id="spCap" value="1500" min="0" step="any"></label>
        <label class="field"><span><span data-i="cog"></span> <em id="cogU"></em></span><input type="number" id="cog" value="0.5" min="0" step="any"></label>
        <label class="field wide"><span><span data-i="wasteRk"></span> <em data-i="u_comma"></em></span><input id="wasteRk" data-ip="wasteRkPh"></label>
        <label class="field wide"><span data-i="strat"></span><select id="strat"><option value="phase" data-i="stratPhase"></option><option value="value" data-i="stratValue"></option><option value="feed" data-i="stratFeed"></option></select></label>
      </div>
    </div>
  </details>

  <details class="step">
    <summary><span class="n">4</span><span data-i="s4"></span><span class="chev">›</span></summary>
    <div class="body">
      <div class="grid2">
        <label class="field wide"><span data-i="gUnit"></span><select id="gUnit"><option value="gpt" data-i="gptOpt"></option><option value="pct" data-i="pctOpt"></option></select></label>
        <label class="field"><span><span data-i="price"></span> <em id="priceU"></em></span><input type="number" id="price" value="3000" min="0" step="any"></label>
        <label class="field"><span><span data-i="rec"></span> <em>%</em></span><input type="number" id="rec" value="90" min="0" max="100" step="any"></label>
        <label class="field"><span><span data-i="cMine"></span> <em data-i="u_cMine"></em></span><input type="number" id="cMine" value="3.2" min="0" step="any"></label>
        <label class="field"><span><span data-i="cProc"></span> <em data-i="u_cProc"></em></span><input type="number" id="cProc" value="22" min="0" step="any"></label>
        <label class="field"><span><span data-i="cRe"></span> <em data-i="u_cRe"></em></span><input type="number" id="cRe" value="1.1" min="0" step="any"></label>
        <label class="field"><span><span data-i="disc"></span> <em data-i="u_pyr"></em></span><input type="number" id="disc" value="8" min="0" step="any"></label>
      </div>
    </div>
  </details>
</aside>

<main class="main">
  <div class="alerts" id="alerts"></div>
  <div class="kpis" id="kpis"></div>
  <section class="work">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="charts" aria-selected="true" data-i="tCharts"></button>

<script>
/*ENGINE-START*/
const Engine = (() => {
  const EPS = 1e-6;
  const fail = code => { const e = new Error(code); e.code = code; throw e; };
  const isNum = s => s !== '' && s != null && isFinite(+s);
  function splitLine(line, d) {
    if (d === 'ws') return line.trim().split(/\s+/);
    if (line.indexOf('"') < 0) return line.split(d).map(s => s.trim());
    const out = []; let cur = '', q = false;
    for (const ch of line) {

  const isComment = l => /^[#%!*]/.test(l);

    const lines = text.split(/\r?\n/);
    const sample = lines.filter(l => l.trim() && !isComment(l.trim())).slice(0, 60);
    let delim = ',', best = 0;
    for (const d of [',', ';', '\t']) {

    }
    if (best === 0) delim = 'ws';
    let hi = -1;
    for (let i = 0; i < Math.min(lines.length, 300); i++) {
      const l = lines[i].trim();
      if (!l || isComment(l)) continue;
      const t = splitLine(l, delim);
      if (t.length < 3) continue;
      const nn = t.filter(x => !isNum(x)).length;
      if (nn < t.length * 0.6) continue;
      let j = i + 1; while (j < lines.length && !lines[j].trim()) j++;
      if (j >= lines.length) continue;
      const t2 = splitLine(lines[j].trim(), delim);
      if (t2.filter(isNum).length >= 3 && t2.length >= t.length - 1) { hi = i; break; }
    }
    if (hi < 0) fail('noHeader');
    const headers = splitLine(lines[hi].trim(), delim).map((h, i) => h || ('col' + (i + 1)));
    const nc = headers.length, cols = headers.map(() => []);
    let n = 0;
    for (let i = hi + 1; i < lines.length; i++) {
      const l = lines[i].trim();
      if (!l || isComment(l)) continue;
      const t = splitLine(l, delim);
      if (t.length < 3) continue;
      for (let c = 0; c < nc; c++) cols[c].push(t[c] === undefined ? '' : t[c]);
      n++;
    }
    if (!n) fail('noRows');
    const numeric = cols.map(col => {
      let k = 0, bad = 0;
      for (let i = 0; i < col.length && k < 2000; i++) { const v = col[i]; if (v === '') continue; k++; if (!isNum(v)) bad++; }
      return k > 0 && bad === 0;
    });
    const data = cols.map((col, i) => numeric[i] ? Float64Array.from(col, v => v === '' ? NaN : +v) : col);
    return { headers, numeric, data, n };
  }
  const KEYS = {
    x: ['x', 'xc', 'xcentre', 'xcenter', 'xworld', 'xcentroid', 'centroidx', 'xcen', 'xmid', 'midx', 'east', 'easting', 'xcoord', 'xpos', 'восток'],
    y: ['y', 'yc', 'ycentre', 'ycenter', 'yworld', 'ycentroid', 'centroidy', 'ycen', 'ymid', 'midy', 'north', 'northing', 'ycoord', 'ypos', 'север'],
    z: ['z', 'zc', 'zcentre', 'zcenter', 'zworld', 'zcentroid', 'centroidz', 'zcen', 'zmid', 'midz', 'rl', 'elev', 'elevation', 'zcoord', 'zpos', 'отметка', 'высота'],
    dx: ['dx', 'xinc', 'xlength', 'xsize', 'dimx', 'xdim', 'sizex', 'xlen', 'xextent', 'xblocksize'],
    dy: ['dy', 'yinc', 'ylength', 'ysize', 'dimy', 'ydim', 'sizey', 'ylen', 'yextent', 'yblocksize'],
    dz: ['dz', 'zinc', 'zlength', 'zsize', 'dimz', 'zdim', 'sizez', 'zlen', 'zextent', 'zblocksize'],
    grade: ['au', 'cu', 'grade', 'ag', 'zn', 'ni', 'pb', 'mo', 'fe', 'u3o8', 'auppm', 'augt', 'augpt', 'cupct', 'gold', 'copper', 'содержание', 'золото', 'медь'],
    density: ['density', 'sg', 'dens', 'bd', 'rd', 'bulkdensity', 'specificgravity', 'drydensity', 'плотность', 'объемныйвес', 'объёмныйвес'],
    tonnes: ['tonnes', 'tons', 'tonnage', 'ton', 'mass', 'тоннаж', 'масса', 'тонны'],
    rock: ['rocktype', 'rock', 'rtype', 'lith', 'lithology', 'mat', 'material', 'oretype', 'domain', 'geol', 'geology', 'zone', 'weathering', 'порода', 'типпороды', 'литология', 'домен'],
    phase: ['pushback', 'phase', 'pb', 'stage', 'cutback', 'pitshell', 'shell', 'pit', 'этап', 'очередь']
  };
  const ORDER = ['x', 'y', 'z', 'dx', 'dy', 'dz', 'grade', 'density', 'tonnes', 'rock', 'phase'];
  const NUMERIC = new Set(['x', 'y', 'z', 'dx', 'dy', 'dz', 'grade', 'density', 'tonnes']);
  const PREFIX = new Set(['grade', 'density', 'tonnes', 'rock', 'phase']);
  const norm = h => String(h).toLowerCase().replace(/[^a-z0-9а-яё]/g, '');
  function detect(headers, numeric) {
    const used = new Set(), map = {};
    for (const pass of [0, 1]) for (const k of ORDER) {
      if (map[k] != null || (pass === 1 && !PREFIX.has(k))) continue;
      for (const name of KEYS[k]) {
        const idx = headers.findIndex((h, i) => !used.has(i) && (!NUMERIC.has(k) || numeric[i]) &&
          (pass === 0 ? norm(h) === name : norm(h).startsWith(name)));
        if (idx >= 0) { map[k] = idx; used.add(idx); break; }
      }
    }
    if (map.grade == null) { const idx = headers.findIndex((h, i) => numeric[i] && !used.has(i)); if (idx >= 0) map.grade = idx; }
    return map;
  }
  function buildModel(parsed, map, o) {
    const D = parsed.data;
    const col = k => (map[k] != null && map[k] >= 0) ? D[map[k]] : null;
    const X = col('x'), Y = col('y'), Z = col('z'), G = col('grade');
    if (!X || !Y || !Z) fail('needXYZ');
    if (!G) fail('needGrade');
    const DX = col('dx'), DY = col('dy'), DZ = col('dz'), DN = col('density'), TN = col('tonnes'), RK = col('rock');
    const PH = o.phSrc === 'col' ? col('phase') : null;
    let F = null;
    if (o.filter && o.filter.col >= 0 && o.filter.val !== '') {
      const fc = D[o.filter.col], isN = parsed.numeric[o.filter.col], v = isN ? +o.filter.val : String(o.filter.val).trim();
      const cmp = { eq: (a, b) => a == b, ne: (a, b) => a != b, gt: (a, b) => a > b, ge: (a, b) => a >= b, lt: (a, b) => a < b, le: (a, b) => a <= b }[o.filter.op];
      F = i => cmp(fc[i], v);
    }
    const A = { x: [], y: [], z: [], dx: [], dy: [], dz: [], t: [], g: [], rock: [], ph: [] };
    const rockNames = [], rockIdx = new Map(), phVals = new Map();
    let air = 0, filtered = 0, outside = 0;
    for (let i = 0; i < parsed.n; i++) {
      if (F && !F(i)) { filtered++; continue; }
      const x = +X[i], y = +Y[i], z = +Z[i];
      if (!isFinite(x) || !isFinite(y) || !isFinite(z)) { filtered++; continue; }
      let dx = DX ? +DX[i] : o.bx, dy = DY ? +DY[i] : o.by, dz = DZ ? +DZ[i] : o.bz;
      if (!(dx > 0)) dx = o.bx; if (!(dy > 0)) dy = o.by; if (!(dz > 0)) dz = o.bz;
      let den = DN ? +DN[i] : o.dens; if (!isFinite(den)) den = o.dens;
      const t = TN ? +TN[i] : dx * dy * dz * den;
      if (!(t > 0)) { air++; continue; }
      let ph = 0;
      if (PH) {
        const pv = PH[i];
        if (pv === '' || pv == null || (typeof pv === 'number' && !(pv > 0)) || pv === '0') { outside++; continue; }
        const key = String(pv); if (!phVals.has(key)) phVals.set(key, pv); ph = key;
      }
      const rk = RK ? String(RK[i]) : '—';
      let ri = rockIdx.get(rk); if (ri == null) { ri = rockNames.length; rockNames.push(rk); rockIdx.set(rk, ri); }
      let g = +G[i]; if (!(g > 0)) g = 0;
      A.x.push(x); A.y.push(y); A.z.push(z); A.dx.push(dx); A.dy.push(dy); A.dz.push(dz); A.t.push(t); A.g.push(g); A.rock.push(ri); A.ph.push(ph);
    }
    const n = A.x.length;
    if (!n) fail('noBlocks');
    const m = {
      n, x: Float64Array.from(A.x), y: Float64Array.from(A.y), z: Float64Array.from(A.z),
      dx: Float32Array.from(A.dx), dy: Float32Array.from(A.dy), dz: Float32Array.from(A.dz),
      t: Float64Array.from(A.t), g: Float64Array.from(A.g), rock: Int32Array.from(A.rock), rockNames,
      phase: new Int32Array(n), phaseKeys: [], bench: new Int32Array(n), benchZ: [], air, filtered, outside
    };
    if (PH) {
      const keys = [...phVals.keys()];
      const allNum = keys.every(k => isFinite(+k));
      keys.sort(allNum ? (a, b) => (+a) - (+b) : (a, b) => a.localeCompare(b));
      const pi = new Map(keys.map((k, i) => [k, i]));
      for (let i = 0; i < n; i++) m.phase[i] = pi.get(A.ph[i]);
      m.phaseKeys = keys;
    } else {
      let tw = 0, cx = 0, cy = 0, zmin = Infinity;
      for (let i = 0; i < n; i++) { tw += m.t[i]; cx += m.x[i] * m.t[i]; cy += m.y[i] * m.t[i]; if (m.z[i] < zmin) zmin = m.z[i]; }
      cx /= tw; cy /= tw;
      const met = new Float64Array(n);
      for (let i = 0; i < n; i++) met[i] = Math.hypot(m.x[i] - cx, m.y[i] - cy) - (m.z[i] - zmin);
      const ord = Array.from({ length: n }, (_, i) => i).sort((a, b) => met[a] - met[b]);
      const N = Math.max(1, Math.min(12, o.phN | 0));
      let acc = 0;
      for (const i of ord) { m.phase[i] = Math.min(N - 1, Math.floor(acc / tw * N)); acc += m.t[i]; }
      m.phaseKeys = Array.from({ length: N }, (_, i) => String(i + 1));
    }
    const zk = [...new Set(Array.from(m.z, z => Math.round(z * 100)))].sort((a, b) => b - a);
    const zi = new Map(zk.map((k, i) => [k, i]));
    m.benchZ = zk.map(k => k / 100);
    for (let i = 0; i < n; i++) m.bench[i] = zi.get(Math.round(m.z[i] * 100));
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity, z0 = Infinity, z1 = -Infinity;
    for (let i = 0; i < n; i++) {
      x0 = Math.min(x0, m.x[i] - m.dx[i] / 2); x1 = Math.max(x1, m.x[i] + m.dx[i] / 2);
      y0 = Math.min(y0, m.y[i] - m.dy[i] / 2); y1 = Math.max(y1, m.y[i] + m.dy[i] / 2);
      z0 = Math.min(z0, m.z[i] - m.dz[i] / 2); z1 = Math.max(z1, m.z[i] + m.dz[i] / 2);
    }
    m.ext = { x0, x1, y0, y1, z0, z1 };
    m.xs = [...new Set(Array.from(m.x, v => Math.round(v * 100)))].sort((a, b) => a - b).map(v => v / 100);
    m.ys = [...new Set(Array.from(m.y, v => Math.round(v * 100)))].sort((a, b) => a - b).map(v => v / 100);
    return m;
  }
  function buildUnits(m, cutoff, wasteRocks) {
    const ws = new Set(); m.rockNames.forEach((r, i) => { if (wasteRocks.has(r.toUpperCase())) ws.add(i); });
    const key = new Map(), units = [];
    for (let i = 0; i < m.n; i++) {
      const k = m.phase[i] * 100000 + m.bench[i];
      let u = key.get(k);

      u.blocks.push(i); u.t += m.t[i];

    const byPhase = m.phaseKeys.map(() => []);
    for (const u of units) {
      u.blocks.sort((a, b) => (m.x[a] - m.x[b]) || (m.y[a] - m.y[b]));
      byPhase[u.phase].push(u);
    }
    byPhase.forEach(l => l.sort((a, b) => a.bench - b.bench));

  }
  function schedule(m, U, p) {
    const NP = U.byPhase.length, BP = U.byPhase;
    const ptr = new Int32Array(NP), started = new Uint8Array(NP);
    for (const u of U.units) { u.rem = u.t; u.hist = []; }
    const lastBench = BP.map(l => l.length ? l[l.length - 1].bench : -1);
    const firstInc = k => ptr[k] < BP[k].length ? BP[k][ptr[k]].bench : Infinity;
    const sp = { t: 0, m: 0 }, periods = [], warnings = [];
    let allDone = BP.every(l => !l.length);
    for (let t = 1; t <= p.maxPeriods && !(allDone && sp.t <= EPS); t++) {
      let mineRem = p.mineCap, millRem = p.millCap;
      const rec = { t, moved: 0, ore: 0, waste: 0, oreMetal: 0, direct: 0, directMetal: 0, toSp: 0, reclaim: 0, reclaimMetal: 0, ph: new Array(NP).fill(null) };
      const touched = BP.map(() => new Set()), blocked = new Set();
      let guard = 0;
      while (mineRem > EPS && guard++ < 200000) {
        let active = 0; for (let k = 0; k < NP; k++) if (started[k] && ptr[k] < BP[k].length) active++;
        const cands = [];
        for (let k = 0; k < NP; k++) {
          if (ptr[k] >= BP[k].length) continue;
          const u = BP[k][ptr[k]];
          if (blocked.has(u)) continue;
          if (!started[k] && active >= p.maxActive) continue;
          if (!touched[k].has(u.bench) && touched[k].size >= p.sink) continue;
          if (k > 0 && firstInc(k - 1) <= Math.min(u.bench + p.lag, lastBench[k - 1])) continue;

function run(level) {
  const t0 = performance.now();
  S.err = null;
  try {
    if (!S.parsed) return;
    if (level === 'model' || !S.model) {
      for (const k of Engine.ORDER) { const v = +$('#map_' + k).value; S.map[k] = v >= 0 ? v : null; }
      S.model = Engine.buildModel(S.parsed, S.map, {
        bx: num('bx') || 1, by: num('by') || 1, bz: num('bz') || 1, dens: num('dens') || 2.7,
        phSrc: $('#phSrc').value === 'col' && S.map.phase != null ? 'col' : 'auto', phN: num('phN') || 1,
        filter: { col: +$('#fCol').value, op: $('#fOp').value, val: $('#fVal').value.trim() }

    }
    const ws = new Set($('#wasteRk').value.split(',').map(s => s.trim().toUpperCase()).filter(Boolean));
    S.U = Engine.buildUnits(S.model, num('cog'), ws);
    S.res = Engine.schedule(S.model, S.U, params());

  } catch (e) { S.err = { k: e.code, msg: e.message }; S.res = null; if (level === 'model') S.model = null; }

}

  m.phaseKeys.forEach((_, k) => {

    for (const x of P) {
      const c = x.ph[k];

/* ---------- plan & section views ---------- */
function setupViews() {
  const m = S.model, r = S.res;
  if (!m || !r) return;
  const sl = $('#perSl'); sl.max = r.periods.length; sl.value = S.view.period;
  const bs = $('#benchSl'); bs.max = m.benchZ.length - 1;
  if (S.view.firstBench == null) {
    const ore = new Float64Array(m.benchZ.length); const cog = num('cog');
    for (let i = 0; i < m.n; i++) if (m.g[i] >= cog) ore[m.bench[i]] += m.t[i];
    S.view.bench = Math.max(0, ore.indexOf(Math.max(...ore))); S.view.firstBench = 1; S.view.sec = -1;
  }
  bs.value = S.view.bench;
  const list = $('#secDir').value === 'EW' ? m.ys : m.xs;
  const ss = $('#secSl'); ss.max = list.length - 1;
  if (S.view.sec < 0 || S.view.sec > list.length - 1) {
    let best = 0, bd = Infinity; const c = $('#secDir').value === 'EW' ? (m.ext.y0 + m.ext.y1) / 2 : (m.ext.x0 + m.ext.x1) / 2;
    list.forEach((v, i) => { if (Math.abs(v - c) < bd) { bd = Math.abs(v - c); best = i; } });
    S.view.sec = best;
  }
  ss.value = S.view.sec;
}
function blockColor(i, mode, per, bp, cog, gmax) {
  const p = bp[i], mined = p > 0 && p <= per;
  if (mode === 'period') return mined ? ramp(RAMP_P, (p - 1) / Math.max(1, S.res.periods.length - 1)) : null;
  if (!mined) return null;
  if (mode === 'phase') return PHC[S.model.phase[i] % PHC.length];
  const g = S.model.g[i];
  return g < cog ? css('--waste') : ramp(RAMP_G, (g - cog) / Math.max(1e-9, gmax - cog));
}
function sizeCanvas(cv, wW, wH) {
  const w = cv.clientWidth || cv.parentElement.clientWidth || 400;
  const h = Math.max(160, Math.min(520, w * wH / wW));
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.height = h + 'px';
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}
function gradeMax() {
  if (S.view.gmaxModel === S.model) return S.view.gmax;
  const a = Array.from(S.model.g).sort((x, y) => x - y);
  S.view.gmax = a[Math.floor(a.length * 0.98)] || 1; S.view.gmaxModel = S.model; return S.view.gmax;
}
function renderViews() {
  const panel = document.querySelector('[data-panel="views"]');
  const m = S.model, r = S.res;
  if (panel.hidden || !m || !r) return;
  const per = S.view.period, mode = $('#colMode').value, bp = r.blockPeriod, cog = num('cog'), gmax = gradeMax();
  const rest = css('--rest'), muted = css('--muted');
  $('#perLbl').textContent = per === 0 ? t('preMining') : perName(per);
  {
    const E = m.ext, pad = 8, b = S.view.bench;
    const cv = $('#plan'), { ctx, w, h } = sizeCanvas(cv, E.x1 - E.x0, E.y1 - E.y0);
    const s = Math.min((w - 2 * pad) / (E.x1 - E.x0), (h - 2 * pad) / (E.y1 - E.y0));
    const ox = (w - s * (E.x1 - E.x0)) / 2, oy = (h - s * (E.y1 - E.y0)) / 2;
    ctx.clearRect(0, 0, w, h);
    const rects = [];
    for (let i = 0; i < m.n; i++) {
      if (m.bench[i] !== b) continue;
      const x = ox + (m.x[i] - m.dx[i] / 2 - E.x0) * s, y = oy + (E.y1 - (m.y[i] + m.dy[i] / 2)) * s, bw = m.dx[i] * s, bh = m.dy[i] * s;
      ctx.fillStyle = blockColor(i, mode, per, bp, cog, gmax) || rest;
      ctx.fillRect(x, y, Math.max(1, bw - (bw > 4 ? 0.6 : 0)), Math.max(1, bh - (bh > 4 ? 0.6 : 0)));
      rects.push([x, y, bw, bh, i]);
    }
    ctx.strokeStyle = muted; ctx.setLineDash([5, 4]); ctx.lineWidth = 1; ctx.beginPath();
    if ($('#secDir').value === 'EW') { const yy = oy + (E.y1 - m.ys[S.view.sec]) * s; ctx.moveTo(0, yy); ctx.lineTo(w, yy); }
    else { const xx = ox + (m.xs[S.view.sec] - E.x0) * s; ctx.moveTo(xx, 0); ctx.lineTo(xx, h); }
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = muted; ctx.font = `11px ${css('--f-mono')}`; ctx.fillText(t('north'), w - 30, 16);
    S.rects.plan = rects;
    $('#benchLbl').textContent = t('benchLbl', m.benchZ[b], b + 1, m.benchZ.length);
  }
  {
    const E = m.ext, pad = 8, ew = $('#secDir').value === 'EW';
    const list = ew ? m.ys : m.xs, at = list[S.view.sec];
    const a0 = ew ? E.x0 : E.y0, a1 = ew ? E.x1 : E.y1;
    const cv = $('#sect'), { ctx, w, h } = sizeCanvas(cv, a1 - a0, Math.max((E.z1 - E.z0) * 1.6, (a1 - a0) * 0.45));
    const s = Math.min((w - 2 * pad) / (a1 - a0), (h - 2 * pad) / (E.z1 - E.z0));
    const ox = (w - s * (a1 - a0)) / 2, oy = (h - s * (E.z1 - E.z0)) / 2;
    ctx.clearRect(0, 0, w, h);
    const rects = [];
    for (let i = 0; i < m.n; i++) {
      const c = ew ? m.y[i] : m.x[i], half = (ew ? m.dy[i] : m.dx[i]) / 2;
      if (Math.abs(c - at) > half * 0.999) continue;
      const a = ew ? m.x[i] : m.y[i], da = ew ? m.dx[i] : m.dy[i];
      const x = ox + (a - da / 2 - a0) * s, y = oy + (E.z1 - (m.z[i] + m.dz[i] / 2)) * s, bw = da * s, bh = m.dz[i] * s;
      ctx.fillStyle = blockColor(i, mode, per, bp, cog, gmax) || rest;
      ctx.fillRect(x, y, Math.max(1, bw - (bw > 4 ? 0.6 : 0)), Math.max(1, bh - (bh > 4 ? 0.6 : 0)));
      rects.push([x, y, bw, bh, i]);

    document.querySelectorAll('#dViewSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === V.mode()));
    g('dFloorRL').disabled = g('dFloorMode').value !== 'fixed';
  }
  function renderAll() { renderInfo(); renderBlocks(); renderVerts(); renderPicks(); renderSegs(); }
  function relang() { renderAll(); leave(); drawSkin(); }

  // exports reuse the CSV modal
  const baseExport = openExport;
  openExport = function (kind) {
    if (!String(kind).startsWith('d_')) return baseExport(kind);
    S.exportKind = kind; let csv = '', title = '', hint = '';
    if (kind === 'd_blk' && st.blk) {
      const q = v => v == null ? '' : (+v).toFixed(3);
      csv = ['name,centroid_x,centroid_y,area_m2,perimeter_m,polygon_rl,mean_dtm_z,floor_rl,volume_m3,tonnes',
        ...st.blk.list.map(b => [/[",]/.test(b.name) ? `"${b.name.replace(/"/g, '""')}"` : b.name, q(b.cx), q(b.cy), q(b.area), q(b.per), q(b.rl), q(b.surf), q(b.floor), q(b.vol), q(b.t)].join(','))].join('\n');
      title = t('x_dBlk'); hint = t('x_dBlkHint');
    } else if (kind === 'd_str') { csv = DtmEng.strText(st.picks, 'recorded_points'); title = t('x_dStr'); hint = t('x_dStrHint'); }
    else { csv = ['point,x,y,z', ...st.picks.map((p, i) => `P${i + 1},${p.x.toFixed(3)},${p.y.toFixed(3)},${p.z.toFixed(3)}`)].join('\n'); title = t('x_dCsv'); hint = t('x_dCsvHint'); }
    g('mTitle').textContent = title; g('mHint').textContent = hint; g('mText').value = csv; g('mMsg').textContent = '';
    if (g('modal').hidden) { g('modal').hidden = false; g('mCopy').focus(); }
  };

  // wiring
  g('dtmBtn').addEventListener('click', () => g('dtmFile').click());
  g('blkBtn').addEventListener('click', () => g('blkFile').click());
  g('dtmFile').addEventListener('change', e => { if (e.target.files.length) loadDtmFiles(e.target.files); e.target.value = ''; });
  g('blkFile').addEventListener('change', e => { if (e.target.files[0]) loadBlkFile(e.target.files[0]); e.target.value = ''; });
  g('dDemoBtn').addEventListener('click', () => { loadDemo(); st.started = true; renderAll(); show(); });
  const wrap = g('d3wrap');
  ['dragenter', 'dragover'].forEach(ty => wrap.addEventListener(ty, e => { e.preventDefault(); wrap.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ty => wrap.addEventListener(ty, e => { e.preventDefault(); wrap.classList.remove('over'); }));
  wrap.addEventListener('drop', e => {
    const fs = [...e.dataTransfer.files]; if (!fs.length) return;
    if (fs.some(f => /\.dtm$/i.test(f.name))) loadDtmFiles(fs); else { const s = fs.find(f => /\.str$/i.test(f.name)); if (s) loadBlkFile(s); }
  });
  document.querySelectorAll('#dModeSeg button').forEach(b => b.addEventListener('click', () => { st.mode = b.dataset.m; renderSegs(); }));
  document.querySelectorAll('#dViewSeg button').forEach(b => b.addEventListener('click', () => { V.setMode(b.dataset.v); renderSegs(); renderInfo(); compass(); }));
  g('dVex').addEventListener('input', () => { g('dVexV').textContent = '×' + nf(vex(), 1); if (st.built) { V.setPos(positions()); V.scene({ zr: (st.dtm.ext.z1 - st.dtm.ext.z0) * vex() }); } });
  ['dOpac', 'dColor', 'dGrid', 'dLabels'].forEach(id => g(id).addEventListener(id === 'dOpac' ? 'input' : 'change', () => { drawSkin(); renderBlocks(); }));
  ['dBench', 'dFloorMode', 'dFloorRL', 'dDens'].forEach(id => g(id).addEventListener(id === 'dFloorMode' ? 'change' : 'input', () => { renderSegs(); recompute(); renderBlocks(); renderInfo(); if (g('dColor').value === 'volume') drawSkin(); }));
  g('dFit').addEventListener('click', () => { if (st.built) V.fit(); });
  g('dBlk').addEventListener('click', e => { const tr = e.target.closest('tr[data-k]'); if (tr) select(+tr.dataset.k === st.sel ? -1 : +tr.dataset.k); });
  g('dPicks').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b) { st.picks.splice(+b.dataset.rm, 1); drawSkin(); renderPicks(); } });
  g('dClear').addEventListener('click', () => { st.picks = []; drawSkin(); renderPicks(); });
  g('dExpBlk').addEventListener('click', () => openExport('d_blk'));
  g('dExpStr').addEventListener('click', () => openExport('d_str'));
  g('dExpCsv').addEventListener('click', () => openExport('d_csv'));
  document.querySelector('.tab[data-tab="dtm"]').addEventListener('click', () => requestAnimationFrame(show));
  const syncTools = () => { document.querySelector('.tabs .tools').hidden = panelOn(); };
  document.querySelectorAll('.tab').forEach(tb => tb.addEventListener('click', syncTools)); syncTools();
  const rebg = () => { if (st.gl) V.setBg(hexRgb(css('--sunk'))); };
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rebg); } catch (e) {}
  new MutationObserver(rebg).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  const baseSetLang = setLang;
  setLang = l => { baseSetLang(l); relang(); };

  applyStatic(); renderAll(); leave();
  if (panelOn()) requestAnimationFrame(show);
  return { st, show };
})();
</script>
